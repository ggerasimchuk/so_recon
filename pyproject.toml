[project]
name = "so-recon"
version = "0.0.1"
description = "SO-RECON: physically constrained Bayesian reconstruction of current oil saturation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "numpy>=2.2,<3",
  "pyarrow>=19",
  "h5py>=3.16.0",
  "psutil>=6.1,<8",
  "matplotlib>=3.9,<4",
  "scipy>=1.18.1",
  # E03 learned proposal: CPU Float32 training, CPU Float64 operational density. The
  # CPU-only index below keeps the lock free of CUDA wheels; Julia packages are unchanged.
  "torch>=2.6,<3",
  "nflows>=0.14,<0.15",
  "safetensors>=0.4,<1",
]

[project.scripts]
so-recon = "so_recon.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
  "mypy>=1.16",
  "types-PyYAML>=6.0",
  "types-psutil>=6.1",
  "scipy-stubs>=1.18.1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# CPU-only PyTorch wheels: the ML proposal trains on CPU Float32 and scores on CPU
# Float64 (COMPUTE §5), so CUDA libraries in the lock would only be dead weight.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/so_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "julia: requires an instantiated Julia environment with JutulDarcy",
  "e01_physics: reads published E01 suite artifacts; needs --run-e01-physics",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# ruff formats python code fences inside Markdown. docs/ holds the normative spec and this
# implementation plan: their fenced blocks are quoted text, not project source, and must not
# be rewritten by `ruff format`. Without this, `make lint` and `make gate` fail on the plan.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["so_recon"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# h5py ships no py.typed marker, so strict mode would otherwise refuse the import.
[[tool.mypy.overrides]]
module = ["h5py", "h5py.*"]
ignore_missing_imports = true
